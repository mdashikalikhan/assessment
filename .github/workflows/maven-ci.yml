name: CI - Assessment

on:
#  push:
#    branches: [ main ]
#  pull_request:
#    branches: [ main ]
  workflow_dispatch:
      
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout source code
      uses: actions/checkout@v3

    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 📦 Build with Maven
      run: mvn clean install --batch-mode

    - name: 🧪 Run tests
      run: mvn test

    - name: Upload JAR Artifact (manual only)
      uses: actions/upload-artifact@v4
      with:
        name: 'assessment'
        path: 'target/*.jar'
        retention-days: 1

    # Optional: Add deploy step here if needed
